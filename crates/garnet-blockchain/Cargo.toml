[package]
name = "garnet-blockchain"
description = "Polygon: redemption, balances, order signing. Carried over from the predecessor."
version = "0.1.0"
edition.workspace = true

[features]
default = []
mock = []

[dependencies]
garnet-types = { path = "../garnet-types" }
garnet-clob = { path = "../garnet-clob" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
# alloy depends on reqwest 0.13; both versions are kept, as they were in the predecessor
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
thiserror = "2"
tracing = "0.1"
chrono = { workspace = true }
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
alloy = { version = "2", default-features = false, features = ["contract", "provider-http", "reqwest", "signer-local", "network", "eip712"] }

[dev-dependencies]
tokio = { workspace = true }
