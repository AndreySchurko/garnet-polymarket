[package]
name = "garnet-bin"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "garnet-core"
path = "src/main.rs"

[dependencies]
garnet-db = { path = "../garnet-db" }
garnet-core = { path = "../garnet-core" }
garnet-copy-engine = { path = "../garnet-copy-engine" }
garnet-risk = { path = "../garnet-risk" }
garnet-config = { path = "../garnet-config" }
garnet-clob = { path = "../garnet-clob" }
garnet-blockchain = { path = "../garnet-blockchain" }
garnet-types = { path = "../garnet-types" }
garnet-feed = { path = "../garnet-feed" }
garnet-bus = { path = "../garnet-bus" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
anyhow = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio-stream = "0.1"
async-nats = "0.35"
rust_decimal_macros = { workspace = true }
garnet-clob = { path = "../garnet-clob", features = ["mock"] }
garnet-blockchain = { path = "../garnet-blockchain", features = ["mock"] }
sqlx = { workspace = true }
